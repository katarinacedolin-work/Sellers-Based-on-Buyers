<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3157ff" />
    <title>Campus Connect — Prototype</title>
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="buyer/buyer.css" />
  </head>
  <body data-mode="buyer">
    <div class="app-shell">
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

      <header class="desktop-header">
        <button class="brand-button" data-action="go-home" aria-label="Campus Connect home, SDSU">
          <img class="brand-logo" src="campus-connect-logo.png" alt="" />
          <span class="brand-campus-separator" aria-hidden="true">·</span>
          <img class="brand-campus-logo" src="sdsu-logo.svg" alt="SDSU" width="120" height="40" />
        </button>

        <div class="header-navs">
          <nav class="desktop-nav" aria-label="Primary navigation">
            <button class="nav-link" data-view="home">Home</button>
            <button class="nav-link" data-view="book">Book</button>
            <button class="nav-link" data-view="shop">Shop</button>
            <button class="nav-link" data-view="jobs">Job Board</button>
            <button class="nav-link" data-view="housing">Housing</button>
            <button class="nav-link" data-view="tickets">Tickets</button>
          </nav>
        </div>

        <div class="header-actions">
          <button type="button" class="mode-switch" data-action="switch-mode" aria-label="Switch to selling">
            <span class="icon" data-icon="repeat" aria-hidden="true"></span><span class="mode-switch-label">Switch to selling</span>
          </button>
          <div class="header-popover-anchor">
            <button type="button" class="icon-button notifications-nav-button" data-action="toggle-notifications" aria-label="Notifications" aria-expanded="false" aria-controls="notification-popover">
              <span class="icon" data-icon="bell" aria-hidden="true"></span><span class="header-badge notification-badge" hidden></span>
            </button>
            <div id="notification-popover" class="notification-popover" role="dialog" aria-label="Notifications" hidden></div>
          </div>
          <button type="button" class="icon-button inbox-nav-button messages-nav-button" data-view="inbox" aria-label="Messages">
            <span class="icon" data-icon="chat" aria-hidden="true"></span><span class="header-badge inbox-badge" hidden></span>
          </button>
          <button class="avatar avatar-small profile-nav-button" data-view="you" aria-label="Your profile"></button>
        </div>
      </header>

      <main id="app-main" tabindex="-1"></main>

      <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-link" data-view="home"><span class="icon" data-icon="home" aria-hidden="true"></span><span>Home</span></button>
        <button class="mobile-nav-link" data-view="book"><span class="icon" data-icon="calendar" aria-hidden="true"></span><span>Book</span></button>
        <button class="mobile-nav-link" data-view="shop"><span class="icon" data-icon="bag" aria-hidden="true"></span><span>Shop</span></button>
        <button class="mobile-nav-link" data-view="jobs"><span class="icon" data-icon="briefcase" aria-hidden="true"></span><span>Jobs</span></button>
        <button class="mobile-nav-link" data-view="housing"><span class="icon" data-icon="bed" aria-hidden="true"></span><span>Housing</span></button>
        <button class="mobile-nav-link" data-view="tickets"><span class="icon" data-icon="ticket" aria-hidden="true"></span><span>Tickets</span></button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <script src="shared/qr.js"></script>
    <script src="shared/icons.js"></script>
    <script src="shared/utils.js"></script>
    <script src="shared/mock-data.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/store.js"></script>
    <script src="shared/ui.js"></script>
    <script src="buyer/views.js"></script>
    <script src="buyer/actions.js"></script>
    <script src="shared/app.js"></script>
  </body>
</html>
