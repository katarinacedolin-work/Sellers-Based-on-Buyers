<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3157ff" />
    <title>Campus Connect — Seller Hub</title>
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="buyer/buyer.css" />
    <link rel="stylesheet" href="seller/seller.css" />
  </head>
  <body data-mode="seller">
    <div class="app-shell">
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

      <header class="desktop-header">
        <button class="brand-button" data-action="go-home" aria-label="Campus Connect Seller Hub home, SDSU">
          <img class="brand-logo" src="campus-connect-logo.png" alt="" />
          <span class="brand-campus-separator" aria-hidden="true">·</span>
          <img class="brand-campus-logo" src="sdsu-logo.svg" alt="SDSU" width="120" height="40" />
          <span class="seller-hub-tag seller-only">Seller Hub</span>
        </button>

        <div class="header-navs">
          <nav class="desktop-nav seller-only" aria-label="Seller navigation">
            <button class="nav-link" data-view="seller-dashboard">Dashboard</button>
            <button class="nav-link nav-link-with-badge" data-view="seller-orders">Orders<span class="nav-badge seller-orders-badge"></span></button>
            <button class="nav-link" data-view="seller-listings">Listings</button>
            <button class="nav-link" data-view="seller-stores">Store</button>
            <button class="nav-link" data-view="seller-analytics">Analytics</button>
          </nav>
        </div>

        <div class="header-actions">
          <button type="button" class="mode-switch selling" data-action="switch-mode" aria-label="Switch to buying">
            <span class="icon" data-icon="repeat" aria-hidden="true"></span><span class="mode-switch-label">Switch to buying</span>
          </button>
          <div class="header-popover-anchor">
            <button type="button" class="icon-button notifications-nav-button" data-action="toggle-notifications" aria-label="Notifications" aria-expanded="false" aria-controls="notification-popover">
              <span class="icon" data-icon="bell" aria-hidden="true"></span><span class="header-badge notification-badge" hidden></span>
            </button>
            <div id="notification-popover" class="notification-popover" role="dialog" aria-label="Notifications" hidden></div>
          </div>
          <button type="button" class="icon-button inbox-nav-button messages-nav-button" data-view="seller-inbox" aria-label="Messages">
            <span class="icon" data-icon="chat" aria-hidden="true"></span><span class="header-badge inbox-badge" hidden></span>
          </button>
          <button class="avatar avatar-small profile-nav-button seller-avatar-button" data-view="seller-profile" aria-label="Your seller profile"></button>
        </div>
      </header>

      <main id="app-main" tabindex="-1"></main>
    </div>

    <div id="modal-root"></div>
    <script src="shared/qr.js"></script>
    <script src="shared/icons.js"></script>
    <script src="shared/utils.js"></script>
    <script src="shared/mock-data.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/store.js"></script>
    <script src="shared/ui.js"></script>
    <script src="buyer/views.js"></script>
    <script src="buyer/actions.js"></script>
    <script src="seller/views.js"></script>
    <script src="seller/actions.js"></script>
    <script src="shared/app.js"></script>
  </body>
</html>
